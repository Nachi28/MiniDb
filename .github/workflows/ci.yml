name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DMINIDB_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Run the demo script
        if: runner.os != 'Windows'
        run: ./build/minidb examples/demo.sql

      - name: Check that data survives a restart
        if: runner.os != 'Windows'
        run: |
          ./build/minidb --db ci.db -h > /dev/null
          echo "CREATE TABLE t (a INTEGER); INSERT INTO t VALUES (1),(2),(3);" > w.sql
          echo "SELECT SUM(a) FROM t;" > r.sql
          ./build/minidb --db ci.db w.sql
          ./build/minidb --db ci.db r.sql | grep -q 6

      - name: Crash recovery torture
        if: runner.os != 'Windows'
        run: ./build/minidb_crash torture --db torture.db --rounds 100

      - name: Benchmark smoke test
        if: runner.os != 'Windows'
        run: ./build/minidb_bench --rows 20000 --db bench.db
