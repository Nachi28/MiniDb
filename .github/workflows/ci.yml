name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DMINIDB_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Run every example
        if: runner.os != 'Windows'
        run: |
          for f in examples/*.sql; do
            ./build/minidb --db ex.db "$f" > /dev/null
            rm -f ex.db ex.db-wal
          done

      - name: Check that data survives a restart
        if: runner.os != 'Windows'
        run: |
          echo "CREATE TABLE t (a INTEGER); INSERT INTO t VALUES (1),(2),(3);" > w.sql
          echo "SELECT SUM(a) FROM t;" > r.sql
          ./build/minidb --db ci.db w.sql
          ./build/minidb --db ci.db r.sql | grep -q 6

      - name: Crash recovery torture
        if: runner.os != 'Windows'
        run: ./build/minidb_crash torture --db torture.db --rounds 100

      - name: Differential test against SQLite
        if: runner.os != 'Windows'
        run: python3 tools/difftest.py --queries 500 --rows 600

      - name: Client/server round trip
        if: runner.os == 'Linux'
        run: |
          ./build/minidb --db net.db --serve 5433 &
          sleep 1
          {
            echo "CREATE TABLE t (a INTEGER);"
            echo "INSERT INTO t VALUES (1),(2),(3);"
            echo "SELECT SUM(a) FROM t;"
            echo ".exit"
          } | ./build/minidb --connect 127.0.0.1:5433 | grep -q 6

      - name: Benchmark smoke test
        if: runner.os != 'Windows'
        run: ./build/minidb_bench --rows 20000 --db bench.db
